name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Check formatting
        run: dotnet format Store.slnx --verify-no-changes --no-restore
      - name: Build with warnings as errors
        run: dotnet build Store.slnx --configuration Release --no-restore
      - name: Run unit and integration tests
        run: dotnet test --solution Store.slnx --configuration Release --no-build
      - name: Audit dependencies
        run: dotnet list Store.slnx package --vulnerable --include-transitive
