<text x="500" y="837" font-family="Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="middle" dominant-baseline="middle" fill="#4c5e6b">CSRF se exige en login y escrituras. La sesión dura 30 minutos.</text>
